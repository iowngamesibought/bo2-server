[package]
name = "bo2-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Experimental private multiplayer and competition backend"

[dependencies]
des = "=0.8.1"
hmac = "=0.12.1"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
tiger = "=0.2.1"
rand = "=0.8.5"
rusqlite = { version = "=0.40.2", features = ["bundled"] }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.8.23"

[[bin]]
name = "bo2-server"
path = "src/main.rs"
